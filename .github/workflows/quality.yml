name: Catalogue quality
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: python3 scripts/validate.py
      - run: python3 scripts/build.py
      - run: python3 scripts/check_site.py
      - run: node --check website/assets/app.js
      - run: node --check website/assets/i18n.js
      - run: node --check website/assets/constellation.js
      - name: Generated files are current
        run: git diff --exit-code -- README.md references.bib implementation-references.bib assets/ website/ docs/taxonomy.md docs/taxonomy.zh-CN.md
